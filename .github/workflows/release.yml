# Soqucoin Release Build Workflow
# Automatically builds and releases binaries for all platforms on tagged releases

name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.21.0)'
        required: true
        default: 'v1.0.0-rc1'

env:
  MAKEFLAGS: -j4
  # The archives carry the tag's name. A workflow_dispatch run from a branch
  # carries the version it was given, so a branch name with a slash in it
  # does not become a path.
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  # ============================================
  # Linux builds, x86_64 and ARM64
  # Each links the libraries from depends (static archives built for the
  # target host) and the compiler's own static runtime, so the packaged
  # binaries need only the C library and the dynamic loader: they run on any
  # 64-bit Linux from Ubuntu 22.04 and Debian 12 onward. The v2.5.1 archives
  # linked the runner's shared libraries and the in-tree univalue as a shared
  # object that was never packaged, so they loaded nowhere as shipped. The
  # check script fails the build on any other library, and smoke-linux runs
  # the archives in clean containers before anything is published.
  # ============================================
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: x86_64-pc-linux-gnu
            asset: linux-x64
            arch: x86-64
            tool_prefix: ''
            cross_packages: ''
          - host: aarch64-linux-gnu
            asset: linux-arm64
            arch: aarch64
            tool_prefix: aarch64-linux-gnu-
            cross_packages: g++-aarch64-linux-gnu gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils \
            python3 curl bison binutils file ${{ matrix.cross_packages }}

      - name: Build depends (static archives for ${{ matrix.host }})
        run: make -C depends HOST=${{ matrix.host }} -j4 NO_QT=1

      - name: Build
        run: |
          ./autogen.sh
          # --disable-shared links the in-tree univalue into the binaries; the
          # static runtime flags keep libstdc++ and libgcc out of NEEDED.
          CONFIG_SITE=$PWD/depends/${{ matrix.host }}/share/config.site \
            ./configure --prefix=/ --without-gui --disable-tests --disable-bench --disable-shared \
              LDFLAGS="-static-libstdc++ -static-libgcc"
          make $MAKEFLAGS
          test -x src/soqucoind && test -x src/soqucoin-cli

      - name: Verify binaries
        run: |
          .github/scripts/check-linux-release.sh ${{ matrix.arch }} 2.35 '${{ matrix.tool_prefix }}' \
            src/soqucoind src/soqucoin-cli
          # configure builds without UPnP, and gives no warning, when it
          # cannot find miniupnpc; ZMQ is left out only by --disable-zmq and
          # the wallet by --disable-wallet. All three are in for both hosts;
          # -help can only be run for the host's own architecture.
          if [ -z '${{ matrix.tool_prefix }}' ]; then
            for opt in -upnp -zmqpubhashblock -disablewallet; do
              if ! src/soqucoind -help | grep -q -- "$opt"; then
                echo "soqucoind -help does not list $opt" >&2
                exit 1
              fi
            done
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp src/soqucoind src/soqucoin-cli dist/
          tar -czvf soqucoin-${{ env.VERSION }}-${{ matrix.asset }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soqucoin-${{ matrix.asset }}
          path: soqucoin-*-${{ matrix.asset }}.tar.gz

  # ============================================
  # Linux smoke test: the packaged archives in clean distribution containers
  # ============================================
  smoke-linux:
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the Linux archives
        uses: actions/download-artifact@v4
        with:
          pattern: soqucoin-linux-*
          path: archives
          merge-multiple: true

      - name: Set up qemu for the arm64 containers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: x86-64 archive in Ubuntu 22.04, Ubuntu 24.04, Debian 12, Debian 13 and Fedora
        run: |
          .github/scripts/smoke-linux-release.sh archives/soqucoin-*-linux-x64.tar.gz linux/amd64 \
            ubuntu:22.04 ubuntu:24.04 debian:12 debian:13 fedora:latest

      - name: arm64 archive in Debian 13 and Ubuntu 24.04, under qemu
        run: |
          .github/scripts/smoke-linux-release.sh archives/soqucoin-*-linux-arm64.tar.gz linux/arm64 \
            debian:13 ubuntu:24.04

  # ============================================
  # macOS Builds (Apple Silicon and Intel)
  # Each architecture builds on a runner of that architecture. The binaries
  # link Homebrew's static archives and load only system libraries, so they
  # run on a Mac without Homebrew from macOS version macos_min.
  # ============================================
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            macos_min: '15.0'
            asset: macos-arm64
          - arch: x86_64
            runner: macos-15-intel
            macos_min: '15.0'
            asset: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install automake libtool boost miniupnpc openssl@3 pkg-config libevent zeromq libsodium

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run: |
          set -o pipefail
          # Each Homebrew lib directory holds a .dylib beside the .a and the
          # linker takes the .dylib, so link from a directory of archives only.
          static_libs="$RUNNER_TEMP/static-libs"
          mkdir -p "$static_libs"
          for formula in boost openssl@3 libevent zeromq miniupnpc libsodium; do
            ln -s "$(brew --prefix "$formula")"/lib/*.a "$static_libs"/
          done
          ./autogen.sh
          # --disable-shared links the in-tree univalue into the binaries.
          # libzmq.a calls libsodium, which nothing else names.
          ./configure --without-gui --disable-tests --disable-bench --disable-wallet --disable-shared \
            --with-boost="$(brew --prefix)" --with-boost-libdir="$static_libs" \
            LDFLAGS="-L$static_libs" \
            CPPFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl@3)/include" \
            LIBS="-lsodium"
          make $MAKEFLAGS 2>&1 | tee build.log
          # The linker only warns when an archive needs a newer macOS than
          # the deployment target.
          if grep -m 5 'built for newer' build.log; then
            echo "an archive needs a newer macOS than $MACOSX_DEPLOYMENT_TARGET" >&2
            exit 1
          fi

      - name: Verify binaries
        run: |
          .github/scripts/check-macos-release.sh ${{ matrix.arch }} ${{ matrix.macos_min }} \
            src/soqucoind src/soqucoin-cli
          # configure builds without UPnP, and gives no warning, when it
          # cannot find miniupnpc; ZMQ is left out only by --disable-zmq.
          for opt in -upnp -zmqpubhashblock; do
            if ! src/soqucoind -help | grep -q -- "$opt"; then
              echo "soqucoind -help does not list $opt" >&2
              exit 1
            fi
          done
          # libsodium.a defines randombytes too, and the static link keeps
          # whichever definition it loads first. The daemon must keep the
          # node's own (src/pat/randombytes.cpp), which ML-DSA key generation
          # and signing call and which calls GetStrongRandBytes. Read the
          # function's instruction lines, from its address to the next
          # symbol's. nm and otool print addresses as 16 lowercase hex digits,
          # so string order is address order; awk would compare two that look
          # like numbers (0000000100100998, 00000001001009e0) as numbers, so
          # "" is appended to each to make it a string.
          if ! read -r _ end < <(nm -n src/soqucoind \
              | awk '$3 == "_randombytes" {s = $1; next} s != "" && $1 "" != s "" {print s, $1; exit}'); then
            echo "nm found no _randombytes in soqucoind, or no symbol after it" >&2
            exit 1
          fi
          if ! otool -tV -p _randombytes src/soqucoind \
              | awk -v end="$end" '$1 !~ /^[0-9a-f]+$/ {next} $1 "" >= end "" {exit} {print}' \
              | grep -q 'GetStrongRandBytes'; then
            echo "soqucoind's randombytes does not call GetStrongRandBytes" >&2
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp src/soqucoind src/soqucoin-cli dist/
          tar -czvf soqucoin-${{ env.VERSION }}-${{ matrix.asset }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soqucoin-${{ matrix.asset }}
          path: soqucoin-*-${{ matrix.asset }}.tar.gz

  # ============================================
  # Windows x64 Cross-Compile Build
  # ============================================
  build-windows-x64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 \
            g++-mingw-w64-x86-64 mingw-w64-x86-64-dev \
            curl
      
      - name: Set mingw-w64 to POSIX threading
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
      
      - name: Build depends
        run: |
          make -C depends HOST=x86_64-w64-mingw32 -j4 NO_QT=1
      
      - name: Build
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
            ./configure --prefix=/ --without-gui --disable-tests --disable-bench
          make $MAKEFLAGS
      
      - name: Package
        run: |
          mkdir -p dist
          cp src/.libs/soqucoind.exe src/.libs/soqucoin-cli.exe dist/ 2>/dev/null || \
          cp src/.libs/soqucoind src/.libs/soqucoin-cli dist/ 2>/dev/null || \
          cp src/soqucoind.exe src/soqucoin-cli.exe dist/ 2>/dev/null || \
          cp src/soqucoind src/soqucoin-cli dist/
          cd dist && zip -r ../soqucoin-${{ env.VERSION }}-windows-x64.zip .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soqucoin-windows-x64
          path: soqucoin-*-windows-x64.zip

  # ============================================
  # Create Release with All Artifacts
  # ============================================
  create-release:
    # Only a tag publishes; a workflow_dispatch run from a branch publishes
    # nothing.
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - smoke-linux
      - build-macos
      - build-windows-x64
    runs-on: ubuntu-latest
    steps:
      # The release notes come from the tag's tree. The checkout goes into its
      # own directory and takes doc/release-notes only, so it never touches the
      # downloaded archives and brings no archive of its own into the find below.
      - name: Checkout the release notes
        uses: actions/checkout@v5
        with:
          sparse-checkout: doc/release-notes
          path: tree

      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Flatten artifacts
        run: |
          mkdir release
          find . -name "*.tar.gz" -exec mv {} release/ \;
          find . -name "*.zip" -exec mv {} release/ \;
      
      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
      
      - name: Release notes
        # The release page's notes are the tag's release-notes file,
        # doc/release-notes/release-notes-<version>.md. A tag whose tree has no
        # such file gets one line that points at the directory, so the archives
        # still publish.
        run: |
          notes="tree/doc/release-notes/release-notes-${VERSION#v}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release/NOTES.md
          else
            printf 'Release notes: doc/release-notes/ in the tree at tag %s.\n' "$VERSION" > release/NOTES.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release/NOTES.md
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

